{% extends 'base.html' %}

{% load static %}


  {% block body %}

<div class="modal fade " data-backdrop="static" data-keyboard="false" id="exampleModalCenter" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true" style="display: block;padding: 0;">
   <div class="modal-dialog modal-dialog-centered" role="document">
     <div class="modal-content" style="
 overflow-x: hidden;
">

       <div class="row no-gutters">

         <div class="col-md-12 d-flex" id="registerform">
           <div class="modal-body p-5 img d-flex align-items-center color-2">
             <div class="text w-100 ">
               <h3 class="mb-4" style="
 color: white;
 font-weight: 200;
 text-align: center;
 font-size: 2em;
">Change Credentials</h3>
<p style="color:red">{{error}} </p>
               <form action="" method="post" id="signup-form" class="signup-form">
                 {% csrf_token %}
                 <div id="changeform">
                 <div id="form1" class="nextform currentform">
                 <div class="form-group mb-3">

                   <input type="text" required class="form-control" name="teamname" placeholder=" Team Name" >
                 </div>
                 <div class="form-group mb-3">

                   <input type="password" required class="form-control" name="password" placeholder="New Password" >
                 </div>
                   <button type="submit" class="btn btn-primary">Submit</button>
               </div>
               </div>
               </form>

             </div>
           </div>
         </div>
       </div>
     </div>
   </div>
 </div>
{% csrf_token %}
<div class="container" style="padding-top: 2em; " id="questt">
  <h2 style="color:white; margin-bottom: 1em;" class="questhead"> Question - {{question.question.heading}}  </h2>
  <div class="quest">
      <h2 style="color:white; margin-bottom: 1em;     text-align: center;" id="questioncontext">  {{question.question.context  }}  </h2>

      <div class="form-group mb-3" style="max-width: 50%;margin: auto;">

        <input type="text" required class="form-control" name="answer" placeholder="Answer Here" >
          <button onclick="submit()" class="btn btn-primary">Submit</button>
      </div>

    </div>
    </div>


  <script src="{% static 'js/jquery.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>

{% if team == "NA" %}
<script type="text/javascript">
   $('#exampleModalCenter').modal('toggle');
</script>
{% else %}
<script type="text/javascript">
   $('#exampleModalCenter').hide();
</script>
{% endif %}
<script>
    

    const chatSocket = new WebSocket(
        'wss://'
        + window.location.host
        + '/ws/chat/'
        + '{{room | safe}}'
        + '/'
    );

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        console.log(data)
        if(data.status){
          if (data.status == "win"){
              createAlert('','Congo Master!',data.message,'success',true,true,'questt');
          }
          else if (data.status == "lose"){
              createAlert('','Master!',data.message,'danger',true,true,'questt');
          }
        }

    };

    chatSocket.onclose = function(e) {
        console.error('Chat socket closed unexpectedly');
    };

</script>
  <script src="{% static 'js/jquery.js' %}"></script>
<script>
  $('input[name="answer"]').keypress(function(e) {
        if(e.which == 13) {
            submit()
        }
    });
</script>
    {% endblock %}
